name: merito

services:
  merito-db:
    image: postgres:16-alpine
    container_name: merito-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merito}
      POSTGRES_USER: ${POSTGRES_USER:-merito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - merito-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - merito_network

  merito:
    build:
      context: .
      dockerfile: src/Merito.Server/Dockerfile
    image: merito:latest
    container_name: merito
    restart: unless-stopped
    depends_on:
      merito-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Merito: "Host=merito-db;Port=5432;Database=${POSTGRES_DB:-merito};Username=${POSTGRES_USER:-merito};Password=${POSTGRES_PASSWORD}"
      WebPush__PublicKey: ${WebPush__PublicKey:-}
      WebPush__PrivateKey: ${WebPush__PrivateKey:-}
      WebPush__Subject: ${WebPush__Subject:-}
    networks:
      - proxy_network
      - merito_network

volumes:
  merito-pgdata:

networks:
  proxy_network:
    external: true
  merito_network:
    driver: bridge
