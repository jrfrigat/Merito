name: merito

services:
  merito-db:
    image: postgres:16-alpine
    container_name: merito-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merito}
      POSTGRES_USER: ${POSTGRES_USER:-merito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - merito-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  merito:
    build:
      context: .
      dockerfile: src/Merito.Server/Dockerfile
    image: merito:latest
    container_name: merito
    restart: unless-stopped
    depends_on:
      merito-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Merito: "Host=merito-db;Port=5432;Database=${POSTGRES_DB:-merito};Username=${POSTGRES_USER:-merito};Password=${POSTGRES_PASSWORD}"
    ports:
      - "${MERITO_PORT:-5080}:8080"

volumes:
  merito-pgdata:
